# =====================================================================================================================
#  Cucumber + JUnit Platform configuration.
#  Every value can be overridden from the command line: ./mvnw test -Dcucumber.filter.tags="@smoke"
# =====================================================================================================================

# Test glue + framework hooks shipped in autto-core
cucumber.glue=io.github.andercmd.autto.e2e,io.github.andercmd.autto.core.cucumber
cucumber.plugin=pretty,\
  summary,\
  io.github.andercmd.autto.core.report.ExtentCucumberPlugin,\
  io.github.andercmd.autto.core.observability.RunSummaryPlugin,\
  io.github.andercmd.autto.core.report.AllureResultsPlugin,\
  html:target/autto-reports/cucumber/cucumber.html,\
  json:target/autto-reports/cucumber/cucumber.json,\
  junit:target/autto-reports/cucumber/cucumber-junit.xml,\
  message:target/autto-reports/cucumber/cucumber.ndjson,\
  rerun:target/autto-reports/rerun.txt
cucumber.publish.quiet=true
cucumber.snippet-type=camelcase

# Scenarios excluded by default. @demo-failure scenarios fail on purpose to showcase the report.
cucumber.filter.tags=not @wip and not @ignore and not @demo-failure

# Parallel execution: ./mvnw test -Dcucumber.execution.parallel.enabled=true
# The pool follows the machine (cores x factor); pin it with strategy=fixed and fixed.parallelism=N when the browsers
# run on a Grid or in the cloud and the number of free sessions is what limits the speed.
cucumber.execution.parallel.enabled=false
cucumber.execution.parallel.config.strategy=dynamic
cucumber.execution.parallel.config.dynamic.factor=1
