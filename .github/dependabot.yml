version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      selenium:
        patterns: ["org.seleniumhq.selenium:*", "io.appium:*"]
      cucumber:
        patterns: ["io.cucumber:*"]
      junit:
        patterns: ["org.junit*"]
      maven-plugins:
        patterns: ["org.apache.maven.plugins:*", "org.codehaus.mojo:*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
