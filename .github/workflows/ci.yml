name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tags:
        description: Cucumber tag expression for the end-to-end matrix
        default: "@smoke"
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_RELEASE: "27"
  MAVEN_ARGS: -B -ntp
  SPRING_PROFILES_ACTIVE: qa,ci
  # Secrets of the application under test. Configure them in Settings → Secrets and variables → Actions.
  # The fallback only exists because saucedemo.com publishes its demo password; remove it for real applications.
  SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD || 'secret_sauce' }}

jobs:
  secrets-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan the repository history for leaked secrets
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --config /repo/.gitleaks.toml

  build:
    name: Build · checkstyle · unit tests · report pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_RELEASE }}
        uses: oracle-actions/setup-java@v1
        with:
          website: jdk.java.net
          release: ${{ env.JAVA_RELEASE }}

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Verify (enforcer, checkstyle, unit tests, browser-less scenarios)
        run: ./mvnw verify -Dcucumber.filter.tags=@showcase

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autto-report-showcase
          path: autto-e2e/target/autto-reports
          retention-days: 14

  e2e:
    name: E2E · ${{ matrix.os }} · ${{ matrix.browser }}
    needs: build
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chrome, firefox, edge]
        include:
          - os: macos-latest
            browser: safari
            experimental: true
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_RELEASE }}
        uses: oracle-actions/setup-java@v1
        with:
          website: jdk.java.net
          release: ${{ env.JAVA_RELEASE }}

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Enable safaridriver
        if: matrix.browser == 'safari'
        run: sudo safaridriver --enable

      - name: Run scenarios
        shell: bash
        env:
          AUTTO_BROWSER_NAME: ${{ matrix.browser }}
          AUTTO_BROWSER_HEADLESS: ${{ matrix.browser != 'safari' }}
        run: >
          ./mvnw install
          -Dcucumber.filter.tags="${{ github.event.inputs.tags || '@smoke' }}"
          -Dautto.report.info.Runner="${{ matrix.os }}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autto-report-${{ matrix.os }}-${{ matrix.browser }}
          path: autto-e2e/target/autto-reports
          retention-days: 14
