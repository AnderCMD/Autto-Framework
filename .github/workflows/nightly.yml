name: Nightly regression

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -ntp
  SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD || 'secret_sauce' }}

jobs:
  grid:
    name: Regression · Selenium Grid · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - uses: actions/checkout@v7

      - uses: oracle-actions/setup-java@v1
        with:
          website: jdk.java.net
          release: "27"

      - name: Start Selenium Grid
        run: docker compose up -d --wait

      - name: Run regression in parallel against the grid
        env:
          SPRING_PROFILES_ACTIVE: qa,ci,grid
          AUTTO_BROWSER_NAME: ${{ matrix.browser }}
        run: >
          ./mvnw install
          -Dcucumber.filter.tags="@regression"
          -Dcucumber.execution.parallel.enabled=true
          -Dcucumber.execution.parallel.config.fixed.parallelism=2

      - name: Stop Selenium Grid
        if: always()
        run: docker compose down

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autto-nightly-grid-${{ matrix.browser }}
          path: autto-e2e/target/autto-reports
          retention-days: 30

  docker-browsers:
    name: Regression · browsers in Docker (WebDriverManager) · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v7

      - uses: oracle-actions/setup-java@v1
        with:
          website: jdk.java.net
          release: "27"

      - name: Run regression with containerized browsers
        env:
          SPRING_PROFILES_ACTIVE: qa,ci,docker
          AUTTO_BROWSER_NAME: ${{ matrix.browser }}
        run: ./mvnw install -Dcucumber.filter.tags="@regression"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autto-nightly-docker-${{ matrix.browser }}
          path: autto-e2e/target/autto-reports
          retention-days: 30
