# =====================================================================================================================
#  Autto · test suite configuration
#
#  Precedence (highest first):
#    1. JVM system properties   ./mvnw test -Dautto.browser.name=firefox
#    2. Environment variables   AUTTO_BROWSER_NAME=firefox  (CI secrets live here)
#    3. .env file               local, git-ignored copy of .env.example
#    4. application-<profile>.yml   select with -Dspring.profiles.active=staging / SPRING_PROFILES_ACTIVE
#    5. this file
#
#  Full reference: docs/en/configuration.md · docs/es/configuracion.md
#  IDE auto-completion of autto.* keys is provided by the configuration metadata shipped in autto-core.
# =====================================================================================================================

spring:
  profiles:
    default: qa
  main:
    banner-mode: off

autto:
  browser:
    # chrome | chromium | firefox | edge | safari
    name: chrome
    # exact version or channel (stable, beta, dev, canary); empty = installed browser
    version:
    headless: false
    # maximized | <width>x<height>
    window-size: 1920x1080
    args: []
    incognito: false
    # Chromium device emulation, e.g. "iPhone 14 Pro Max"
    mobile-emulation:
    accept-insecure-certs: true
    # normal | eager | none
    page-load-strategy: normal
    download-dir: target/downloads
    # collect console messages and JavaScript errors (WebDriver BiDi), attached on failure
    console-logs: true
    # browser preferences, e.g.  intl.accept_languages: es-ES
    prefs: {}

  driver:
    # webdrivermanager | selenium-manager
    resolution: webdrivermanager
    # use Selenium Manager if WebDriverManager cannot resolve the driver
    fallback: true
    # browser not installed? start it in Docker automatically (requires Docker)
    docker-fallback: false
    # extra attempts when the browser session cannot be created (busy Grid / cloud), with exponential back-off
    start-retries: 1
    start-retry-delay: 2s

  execution:
    # local | docker | remote | appium
    target: local
    remote-url: http://localhost:4444
    platform-name:
    # any W3C / vendor capability, e.g.  se:recordVideo: true   or   bstack:options: {os: Windows}
    capabilities: {}

  timeouts:
    implicit: 0s
    explicit: 15s
    page-load: 60s
    script: 30s
    polling: 250ms

  evidence:
    # off | on-failure | always (screenshot after every step)
    screenshot: on-failure
    # off | on-failure | always
    video: on-failure
    video-fps: 3
    video-max-duration: 5m
    video-max-width: 1280
    page-source: true

  report:
    dir: target/autto-reports
    timestamped: false
    title: Autto · Test Automation Report
    name: Autto Framework · Execution report
    # dark | standard
    theme: dark
    offline: true
    timeline: true
    screenshots-base64: false
    author:
    show-host: true
    info:
      Project: Autto Framework demo (saucedemo.com)

  api:
    # base URL of the API under test (requests may also use absolute URLs)
    base-url: https://www.saucedemo.com
    connect-timeout: 10s
    read-timeout: 30s
    # trust self-signed certificates (test environments only)
    relaxed-https: false
    # attach every request and response (masked) to the report
    report: true
    # default headers of every request; secret values belong in .env / CI secrets:  Authorization: Bearer ${API_TOKEN}
    headers: {}

  accessibility:
    # axe-core rule tags: wcag2a, wcag2aa, wcag21a, wcag21aa, wcag22aa, best-practice...
    tags: [wcag2a, wcag2aa, wcag21a, wcag21aa]
    disabled-rules: []
    # minor | moderate | serious | critical — impact rejected by "the page has no accessibility violations"
    fail-on: serious

  scenario:
    # a scenario running longer than this is aborted (its browser is closed); 0 disables the guard
    timeout: 10m

  performance:
    # budgets of WebPerformance.measure().assertWithinBudget(); 0 disables one. Core Web Vitals "good" values are
    # fcp 1.8s · lcp 2.5s · cls 0.1. The demo store is a third-party site reached over the public internet, so these
    # are only a canary against catastrophic slowness: set real budgets for the application you own.
    fcp: 10s
    lcp: 12s
    cls: 0.25
    ttfb: 5s
    load: 30s

  visual:
    baseline-dir: src/test/resources/visual
    # share of different pixels still accepted (0.001 = 0.1 %)
    tolerance: 0.001
    # per-channel difference (0-255) below which two pixels are the same colour
    pixel-threshold: 10
    # true (or -Dautto.visual.update=true) creates / replaces the baselines instead of comparing
    update: false

  # JDBC access for data set-up / verification (add your database driver to the test project):
  #   db: {url: "jdbc:postgresql://localhost:5432/shop", username: shop, password: ${DB_PASSWORD}}
  db:
    url:

  mail:
    # Mailpit (docker compose --profile mail up -d); the application under test must send to its SMTP port 1025
    url: http://localhost:8025
    timeout: 30s

  notifications:
    # Slack / Teams incoming webhook (keep it in a secret: AUTTO_NOTIFICATIONS_WEBHOOK_URL)
    webhook-url:
    # slack | teams | generic
    type: slack
    only-on-failure: false
    # link shown in the message (CI run, GitHub Pages...): AUTTO_NOTIFICATIONS_REPORT_URL
    report-url:

# ---------------------------------------------------------------------------------------------------------------------
#  Test users. Passwords are NEVER written here: they reference secrets resolved from .env (local) or CI secrets.
# ---------------------------------------------------------------------------------------------------------------------
test-data:
  users:
    standard:
      username: ${SAUCE_STANDARD_USERNAME:standard_user}
      password: ${SAUCE_PASSWORD}
    locked:
      username: locked_out_user
      password: ${SAUCE_PASSWORD}
    problem:
      username: problem_user
      password: ${SAUCE_PASSWORD}
    performance:
      username: performance_glitch_user
      password: ${SAUCE_PASSWORD}
