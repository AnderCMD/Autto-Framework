name: Bug report / Reporte de error
description: Something does not work as documented / Algo no funciona como está documentado
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened? / ¿Qué pasó?
      description: Include the command you ran and the relevant part of the log or report.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour / Comportamiento esperado
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment / Entorno
      placeholder: "OS, Java version, browser + version, execution.target (local/remote/appium)"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration / Configuración relevante
      description: Remove any secret before pasting / Elimina cualquier secreto antes de pegar
      render: properties
