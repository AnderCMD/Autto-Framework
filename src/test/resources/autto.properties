# =====================================================================================================================
#  Autto Framework - project configuration
#
#  Resolution order (last wins):
#    1. this file
#    2. environments/<env>.properties          (select it with -Denv=staging or AUTTO_ENV=staging)
#    3. environment variables  AUTTO_<KEY>      (browser.headless -> AUTTO_BROWSER_HEADLESS)
#    4. system properties      -D<key>=<value>  (mvn test -Dbrowser=firefox)
#
#  Full reference: docs/en/configuration.md  |  docs/es/configuracion.md
# =====================================================================================================================

env=qa

# ---------------------------------------------------------------- browser
# chrome | firefox | edge | safari
browser=chrome
# Exact version, or channel: stable | beta | dev | canary. Empty = installed browser (Selenium Manager downloads it if missing)
browser.version=
browser.headless=false
# maximized | <width>x<height>
browser.window.size=1920x1080
# Extra command line arguments, comma separated
browser.args=
# Custom browser binary (Chromium, Brave, Firefox Developer Edition...)
browser.binary=
browser.incognito=false
# Chromium device emulation, e.g. "iPhone 14 Pro Max", "Pixel 7", "iPad Pro"
browser.mobile.emulation=
browser.accept.insecure.certs=true
# normal | eager | none
browser.page.load.strategy=normal
browser.download.dir=target/downloads
# accept | dismiss | accept and notify | dismiss and notify | ignore  (empty = ignore when video is on)
browser.unhandled.prompt=
# Capture browser console messages and JavaScript errors through WebDriver BiDi and attach them on failure
browser.console.logs=true
# Browser preferences: browser.prefs.<name>=<value>
# browser.prefs.intl.accept_languages=es-ES

# ---------------------------------------------------------------- execution target
# local | remote | appium
execution.target=local
remote.url=http://localhost:4444
# Requested OS on remote targets: Windows 11, macOS 15, linux...
platform.name=
# Any W3C / vendor capability: capabilities.<name>=<value>
# capabilities.se:recordVideo=true
# capabilities.bstack:options.os=Windows
# capabilities.bstack:options.osVersion="11"

# ---------------------------------------------------------------- appium (mobile)
appium.url=http://127.0.0.1:4723
# android | ios
appium.platform=android
appium.app=
# capabilities.appium:deviceName=Pixel 8
# capabilities.browserName=Chrome

# ---------------------------------------------------------------- timeouts (seconds)
timeouts.implicit=0
timeouts.explicit=15
timeouts.page.load=60
timeouts.script=30
timeouts.polling.ms=250

# ---------------------------------------------------------------- evidence
# off | on_failure | always   (always = a screenshot after every step)
screenshot.mode=on_failure
# off | on_failure | always
video.mode=on_failure
video.fps=3
video.max.seconds=300
video.max.width=1280
# Attach the HTML source of the page when a scenario fails
evidence.page.source=true

# ---------------------------------------------------------------- report
report.dir=target/autto-reports
# true = one sub-folder per run (yyyyMMdd-HHmmss), keeps history between runs
report.timestamped=false
report.title=Autto · Test Automation Report
report.name=Autto Framework · Execution report
# dark | standard
report.theme=dark
# true = report works without internet (assets copied next to the report)
report.offline=true
report.timeline=true
# true = screenshots embedded inside the HTML (single file, heavier); false = PNG files next to the report
report.screenshots.base64=false
# Default author when a scenario has no @author:<name> tag
report.author=
# Show user and host name in the dashboard
report.show.host=true
# Extra rows for the dashboard "Environment" table: report.info.<label>=<value>
report.info.Project=Autto Framework demo (saucedemo.com)
