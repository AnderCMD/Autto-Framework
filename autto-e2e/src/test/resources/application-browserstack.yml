# BrowserStack. Credentials come from .env / CI secrets (BROWSERSTACK_USERNAME, BROWSERSTACK_ACCESS_KEY).
#   ./mvnw test -Dspring.profiles.active=qa,browserstack
autto:
  execution:
    target: remote
    remote-url: https://${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}@hub-cloud.browserstack.com/wd/hub
    capabilities:
      bstack:options:
        os: Windows
        osVersion: '"11"'
        projectName: Autto
        buildName: ${GITHUB_RUN_ID:local}
