# Configuration used by the framework unit tests
spring:
  profiles:
    default: unit

autto:
  base-url: https://example.test
  browser:
    name: firefox
    args: [--lang=es, --mute-audio]
  execution:
    capabilities:
      "[se:recordVideo]": true
      appium:deviceName: Pixel 8
      bstack:options:
        os: Windows
        osVersion: '"11"'
  report:
    info:
      Team: QA
  api:
    base-url: https://api.example.test
    read-timeout: 5s
    headers:
      Accept: application/json
      X-Api-Key: unit-test-api-key
  accessibility:
    tags: [wcag2a]
    fail-on: critical
