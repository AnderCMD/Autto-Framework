# Selenium Grid 4 for local / CI remote execution.
#
#   docker compose up -d
#   ./mvnw test -Dexecution.target=remote -Dremote.url=http://localhost:4444 -Dbrowser=firefox
#   docker compose down
#
# Grid console: http://localhost:4444/ui  (watch sessions live with noVNC, password: secret)
# Pin a specific image version with: SELENIUM_IMAGE_TAG=<tag> docker compose up -d
# Note: the Edge image is only published for linux/amd64.

x-node: &node
  shm_size: 2gb
  depends_on:
    - selenium-hub
  environment: &node-env
    SE_EVENT_BUS_HOST: selenium-hub
    SE_EVENT_BUS_PUBLISH_PORT: "4442"
    SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
    SE_NODE_MAX_SESSIONS: "${SE_NODE_MAX_SESSIONS:-2}"
    SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    SE_VNC_NO_PASSWORD: "false"

services:
  selenium-hub:
    image: selenium/hub:${SELENIUM_IMAGE_TAG:-latest}
    container_name: autto-selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4444/status"]
      interval: 10s
      timeout: 5s
      retries: 10

  chrome:
    <<: *node
    image: selenium/node-chrome:${SELENIUM_IMAGE_TAG:-latest}

  firefox:
    <<: *node
    image: selenium/node-firefox:${SELENIUM_IMAGE_TAG:-latest}

  edge:
    <<: *node
    image: selenium/node-edge:${SELENIUM_IMAGE_TAG:-latest}
    platform: linux/amd64
